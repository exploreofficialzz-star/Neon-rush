name: neon_rush
description: "Neon Rush - An endless runner game by chAs Tech Group"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_mobile_ads: ^5.1.0
  audioplayers: ^6.0.0
  shared_preferences: ^2.2.2
  cupertino_icons: ^1.0.8
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/characters/
    - assets/images/environment/
    - assets/images/obstacles/
    - assets/images/powerups/
    - assets/images/ui/
    - assets/icons/
    - assets/audio/
