name: iOS CI/CD — Disabled Until Ready

on:
  workflow_dispatch:
    inputs:
      enabled:
        description: 'Set to true to run iOS build'
        required: true
        default: 'false'

jobs:
  build:
    runs-on: macos-latest
    if: ${{ github.event.inputs.enabled == 'true' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Xcode 15.2
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.2'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Install CocoaPods
        run: sudo gem install cocoapods

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Install Pods
        run: |
          cd ios
          pod install --repo-update

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        run: |
          mkdir -p build/ios/ipa
          cd build/ios/iphoneos
          zip -r ../ipa/NeonRush-unsigned.ipa Runner.app
        continue-on-error: true

      - name: Upload iOS unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: build/ios/ipa/*.ipa
          retention-days: 30
