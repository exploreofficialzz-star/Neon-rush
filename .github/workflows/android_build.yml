name: Android CI/CD — Signed Release

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze --no-fatal-infos

      # Decode & write keystore from GitHub Secret
      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/neonrush-release.keystore

      # Write key.properties so Gradle picks up signing config
      - name: Write key.properties
        run: |
          cat > android/key.properties << PROPS
          storePassword=${{ secrets.STORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=neonrush-release.keystore
          PROPS

      - name: Build signed APK
        run: flutter build apk --release --split-per-abi

      - name: Build signed App Bundle (AAB)
        run: flutter build appbundle --release

      - name: Upload signed APKs
        uses: actions/upload-artifact@v4
        with:
          name: android-signed-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: android-signed-aab
          path: build/app/outputs/bundle/release/*.aab
          retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Download AAB artifact
        uses: actions/download-artifact@v4
        with:
          name: android-signed-aab
          path: aab/

      - name: List build output
        run: ls -lh aab/

      # Uncomment below when ready to push to Play Store via Fastlane / supply
